<svg width="200" height="120" viewBox="0 0 200 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Sky background -->
  <rect width="200" height="120" rx="8" fill="#E0F2FE"/>
  <!-- Clouds -->
  <ellipse cx="40" cy="35" rx="18" ry="10" fill="white"/>
  <ellipse cx="55" cy="35" rx="14" ry="8" fill="white"/>
  <ellipse cx="150" cy="25" rx="16" ry="9" fill="white"/>
  <ellipse cx="165" cy="25" rx="12" ry="7" fill="white"/>
  <!-- Ground -->
  <rect y="90" width="200" height="30" fill="#86EFAC"/>
  <!-- Drone body -->
  <rect x="85" y="50" width="30" height="16" rx="4" fill="#374151"/>
  <!-- Drone arms -->
  <rect x="65" y="54" width="24" height="4" rx="2" fill="#6B7280"/>
  <rect x="111" y="54" width="24" height="4" rx="2" fill="#6B7280"/>
  <!-- Propellers -->
  <ellipse cx="65" cy="52" rx="12" ry="3" fill="#9CA3AF"/>
  <ellipse cx="135" cy="52" rx="12" ry="3" fill="#9CA3AF"/>
  <!-- Camera -->
  <circle cx="100" cy="70" r="6" fill="#1F2937"/>
  <circle cx="100" cy="70" r="3" fill="#60A5FA"/>
  <!-- Landing gear -->
  <rect x="80" y="66" width="4" height="10" rx="1" fill="#6B7280"/>
  <rect x="116" y="66" width="4" height="10" rx="1" fill="#6B7280"/>
  <rect x="74" y="74" width="16" height="3" rx="1" fill="#6B7280"/>
  <rect x="110" y="74" width="16" height="3" rx="1" fill="#6B7280"/>
</svg>
